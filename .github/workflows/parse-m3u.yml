name: Update M3U and API

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"   # 每6小时更新一次

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Fetch remote interface.txt
        run: |
          curl -sL https://develop202.github.io/migu_video/interface.txt -o raw_interface.txt

      - name: Parse to M3U and API
        run: |
          node parse-to-m3u.js

      - name: Commit files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add cleaned_interface.m3u api.txt
          git diff --cached --quiet || git commit -m "Update m3u and api"
          git push