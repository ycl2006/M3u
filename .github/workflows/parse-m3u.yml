name: Update IPTV Upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22,10 * * *"   # 每天10点22点自动更新

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Fetch upstream interface.txt
        run: |
          curl -fsSL https://develop202.github.io/migu_video/interface.txt -o upstream.txt

      - name: Compare with existing
        run: |
          if [ -f raw_interface.txt ]; then
            diff upstream.txt raw_interface.txt >/dev/null && echo "NO_CHANGE=true" >> $GITHUB_ENV
          fi

      - name: Update raw_interface.txt
        if: env.NO_CHANGE != 'true'
        run: mv upstream.txt raw_interface.txt

      - name: Generate M3U & API
        if: env.NO_CHANGE != 'true'
        run: node parse.js

      - name: Commit & Push
        if: env.NO_CHANGE != 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add raw_interface.txt cleaned_interface.m3u api.txt
          git commit -m "sync: upstream update"
          git push