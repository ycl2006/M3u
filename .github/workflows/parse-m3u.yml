name: Update IPTV Upstream

on:
  workflow_dispatch:
  schedule:
    # UTC 10:00 / 22:00（北京时间 18:00 / 06:00）
    - cron: "0 10,22 * * *"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          else
            echo "No package.json, skip npm install"
          fi

      # ===== 直接交给 parse.js 处理多源 =====
      - name: Run IPTV merge & generate
        run: |
          node parse.js

      # ===== 提交变更 =====
      - name: Commit & Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add result.m3u result.txt

          git diff --cached --quiet || {
            git commit -m "chore: update IPTV sources ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}