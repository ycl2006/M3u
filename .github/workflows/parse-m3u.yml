name: Update IPTV Upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10,22 * * *"   # UTC 10:00 / 22:00（JST 19:00 / 07:00）

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          else
            echo "No package.json, skip npm install"
          fi

      # ===== 读取 upstream.conf（一行一个链接）=====
      - name: Load upstream list
        shell: bash
        run: |
          if [ ! -f upstream.conf ]; then
            echo "upstream.conf not found"
            exit 1
          fi

          mapfile -t UPSTREAM_URLS < <(
            sed 's/#.*//' upstream.conf | sed '/^\s*$/d'
          )

          if [ ${#UPSTREAM_URLS[@]} -eq 0 ]; then
            echo "No upstream URLs found"
            exit 1
          fi

          echo "Loaded ${#UPSTREAM_URLS[@]} upstream URLs"

      # ===== 多源轮询下载 =====
      - name: Fetch upstream interface.txt (multi-source)
        shell: bash
        run: |
          SUCCESS=false

          for URL in "${UPSTREAM_URLS[@]}"; do
            echo "Trying upstream: $URL"

            if curl -fsSL --connect-timeout 10 --max-time 30 "$URL" -o upstream.txt; then
              if [ -s upstream.txt ]; then
                echo "Download success from: $URL"
                SUCCESS=true
                break
              else
                echo "Downloaded but empty file"
              fi
            else
              echo "Failed to download from: $URL"
            fi
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "All upstream sources failed"
            exit 1
          fi

          echo "Final upstream.txt size: $(stat -c%s upstream.txt) bytes"

      # ===== 内容对比 =====
      - name: Compare with existing raw_interface.txt
        run: |
          if [ -f raw_interface.txt ] && cmp -s upstream.txt raw_interface.txt; then
            echo "NO_CHANGE=true" >> "$GITHUB_ENV"
            echo "No change detected"
          else
            echo "NO_CHANGE=false" >> "$GITHUB_ENV"
            echo "Change detected"
          fi

      # ===== 更新原始文件 =====
      - name: Update raw_interface.txt
        if: env.NO_CHANGE != 'true'
        run: |
          mv upstream.txt raw_interface.txt

      # ===== 生成输出 =====
      - name: Generate M3U & API files
        if: env.NO_CHANGE != 'true'
        run: |
          node parse.js

      # ===== 提交 =====
      - name: Commit & Push changes
        if: env.NO_CHANGE != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add raw_interface.txt cleaned_interface.m3u api.txt

          git diff --cached --quiet || {
            git commit -m "chore: sync upstream $(date +'%Y-%m-%d %H:%M UTC')"
            git push
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Done
        run: |
          echo "Workflow finished."
          echo "NO_CHANGE=${NO_CHANGE:-false}"