name: Update IPTV Upstream

on:
  workflow_dispatch:
  schedule:
    # UTC 10:00 / 22:00（北京时间 18:00 / 06:00）
    - cron: "30 10,22 * * *"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ===== 拉代码 =====
      - name: Checkout repository
        uses: actions/checkout@v4

      # ===== Node =====
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # ===== 依赖（可选）=====
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          fi

      # ===== 核心：只跑 parse.js =====
      - name: Generate IPTV result
        run: |
          node parse.js

      # ===== 提交 =====
      - name: Commit & Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add result.m3u result.txt

          git diff --cached --quiet || {
            git commit -m "chore: update IPTV sources ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}