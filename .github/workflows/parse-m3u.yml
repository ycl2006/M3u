name: Update IPTV Upstream

on:
  workflow_dispatch:
  schedule:
    # UTC 10:00 / 22:00（北京时间 18:00 / 06:00）
    - cron: "0 10,22 * * *"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          fi

      # ===== 读取 upstream.conf → 下载 → 合并 =====
      - name: Load, fetch & merge upstreams
        shell: bash
        run: |
          set -e

          if [ ! -f upstream.conf ]; then
            echo "upstream.conf not found"
            exit 1
          fi

          rm -f upstream_merged.txt
          touch upstream_merged.txt

          INDEX=0
          SUCCESS=0

          echo "===== Upstream list ====="
          sed -n '1,200p' upstream.conf
          echo "========================="

          while IFS= read -r line || [ -n "$line" ]; do
            # 去注释 & 空白
            line="${line%%#*}"
            line="$(echo "$line" | xargs)"
            [ -z "$line" ] && continue

            INDEX=$((INDEX+1))
            echo "[$INDEX] Fetching: $line"

            if curl -fsSL --connect-timeout 10 --max-time 30 "$line" -o "upstream_$INDEX.txt"; then
              if [ -s "upstream_$INDEX.txt" ]; then
                echo "  ✔ success ($(wc -l < upstream_$INDEX.txt) lines)"
                cat "upstream_$INDEX.txt" >> upstream_merged.txt
                echo >> upstream_merged.txt
                SUCCESS=$((SUCCESS+1))
              else
                echo "  ⚠ empty file"
              fi
            else
              echo "  ✖ failed"
            fi
          done < upstream.conf

          if [ "$SUCCESS" -eq 0 ]; then
            echo "No upstream data fetched"
            exit 1
          fi

          echo "Merged total lines: $(wc -l < upstream_merged.txt)"

      # ===== 去重 =====
      - name: Deduplicate merged interface
        run: |
          sort -u upstream_merged.txt > raw_interface.txt
          echo "After deduplication: $(wc -l < raw_interface.txt) lines"

      # ===== 与旧版本对比 =====
      - name: Compare with existing raw_interface.txt
        run: |
          if git show HEAD:raw_interface.txt > raw_interface.txt.bak 2>/dev/null \
             && cmp -s raw_interface.txt raw_interface.txt.bak; then
            echo "NO_CHANGE=true" >> "$GITHUB_ENV"
            echo "No change detected"
          else
            echo "NO_CHANGE=false" >> "$GITHUB_ENV"
            echo "Change detected"
          fi

      # ===== 生成 M3U / API =====
      - name: Generate M3U & API files
        if: env.NO_CHANGE != 'true'
        run: |
          node parse.js

      # ===== 提交 =====
      - name: Commit & Push changes
        if: env.NO_CHANGE != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add raw_interface.txt cleaned_interface.m3u api.txt

          git diff --cached --quiet || {
            git commit -m "chore: merge & dedup upstream interfaces"
            git push
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}