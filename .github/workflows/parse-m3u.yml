name: Update IPTV Upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10,22 * * *"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          fi

      # ===== 读取 upstream.conf =====
      - name: Load upstream list
        shell: bash
        run: |
          if [ ! -f upstream.conf ]; then
            echo "upstream.conf not found"
            exit 1
          fi

          mapfile -t UPSTREAM_URLS < <(
            sed 's/#.*//' upstream.conf | sed '/^\s*$/d'
          )

          echo "Loaded ${#UPSTREAM_URLS[@]} upstream URLs"

      # ===== 下载并合并所有 upstream =====
      - name: Fetch & merge all upstreams
        shell: bash
        run: |
          rm -f upstream_merged.txt
          touch upstream_merged.txt

          INDEX=0

          for URL in "${UPSTREAM_URLS[@]}"; do
            INDEX=$((INDEX+1))
            echo "[$INDEX] Fetching: $URL"

            if curl -fsSL --connect-timeout 10 --max-time 30 "$URL" -o "upstream_$INDEX.txt"; then
              if [ -s "upstream_$INDEX.txt" ]; then
                echo "  ✔ success, appending"
                cat "upstream_$INDEX.txt" >> upstream_merged.txt
                echo >> upstream_merged.txt
              else
                echo "  ⚠ empty file, skipped"
              fi
            else
              echo "  ✖ failed"
            fi
          done

          if [ ! -s upstream_merged.txt ]; then
            echo "No upstream data fetched"
            exit 1
          fi

          echo "Merged size: $(wc -l < upstream_merged.txt) lines"

      # ===== 去重并生成 raw_interface.txt =====
      - name: Deduplicate merged interface
        run: |
          sort -u upstream_merged.txt > raw_interface.txt
          echo "After deduplication: $(wc -l < raw_interface.txt) lines"

      # ===== 内容对比 =====
      - name: Compare with existing raw_interface.txt
        run: |
          if [ -f raw_interface.txt.bak ]; then rm raw_interface.txt.bak; fi

          if git show HEAD:raw_interface.txt > raw_interface.txt.bak 2>/dev/null \
             && cmp -s raw_interface.txt raw_interface.txt.bak; then
            echo "NO_CHANGE=true" >> "$GITHUB_ENV"
          else
            echo "NO_CHANGE=false" >> "$GITHUB_ENV"
          fi

      # ===== 生成输出 =====
      - name: Generate M3U & API files
        if: env.NO_CHANGE != 'true'
        run: |
          node parse.js

      # ===== 提交 =====
      - name: Commit & Push changes
        if: env.NO_CHANGE != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add raw_interface.txt cleaned_interface.m3u api.txt

          git diff --cached --quiet || {
            git commit -m "chore: merge & dedup upstream interfaces"
            git push
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}